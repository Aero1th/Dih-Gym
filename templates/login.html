<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Sign_In.css') }}">
    <title>Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="gym-header">
        <div class="logo-container">
            <span class="logo-dih">DIH</span>
            <h1 class="logo-gym">GYM</h1>
        </div>
    </header>
    <main class="signin-container">
        <h2 class="signin-title">SIGN IN</h2>
        <form class="signin-form" action="/login" method="POST">
            <div class="form-group">
                <label for="email">EMAIL:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">PASSWORD:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-actions">
                <a href="/" class="btn btn-cancel">CANCEL</a>
                <p class="signup-text">
                    Don’t have an account? <a href="/signup">Sign Up</a>
                </p>
                <button type="submit" class="btn btn-enter">ENTER</button>
            </div>
        </form>
    </main>
</body>
</html>

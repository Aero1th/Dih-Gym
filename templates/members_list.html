<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIH GYM - Members</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/memberlist.css') }}">
</head>
<body>
    <header class="brand-header">
        <div class="brand-logo">
            <span class="logo-red">DIH</span>
            <span class="logo-white">GYM</span>
        </div>
    </header>

    <main class="page-container">
        <h1 class="page-title">Members List</h1>
        <div class="table-container">
            <table class="member-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for member in members %}
                    <tr>
                        <td>{{ member.user_id }}</td>
                        <td>{{ member.first_name }} {{ member.last_name }}</td>
                        <td>{{ member.email }}</td>
                        <td>{{ member.created_at }}</td>
                        <td><a href="/delete-member/{{ member.user_id }}">Delete</a></td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5">No members found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <p><a href="/admin-dashboard">Back to Dashboard</a></p>
    </main>
</body>
</html>

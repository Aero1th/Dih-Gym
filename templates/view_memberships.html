<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIH GYM - Memberships</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/memberlist.css') }}">
</head>
<body>
    <header class="brand-header">
        <div class="brand-logo">
            <span class="logo-red">DIH</span>
            <span class="logo-white">GYM</span>
        </div>
    </header>

    <main class="page-container">
        <h1 class="page-title">Memberships</h1>
        <div class="table-container">
            <table class="member-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Plan</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Days</th>
                    </tr>
                </thead>
                <tbody>
                    {% for membership in memberships %}
                    <tr>
                        <td>{{ membership.membership_id }}</td>
                        <td>{{ membership.plan_name }}</td>
                        <td>{{ membership.description }}</td>
                        <td>{{ membership.price }}</td>
                        <td>{{ membership.duration_days }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5">No memberships found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <p><a href="/admin-dashboard">Back to Dashboard</a></p>
    </main>
</body>
</html>

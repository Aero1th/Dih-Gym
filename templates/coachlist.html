<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIH GYM - Coach Listing</title>
    <link rel="stylesheet" href="../static/css/coachlist.css">
</head>
<body>

    <header class="brand-header">
        <div class="brand-logo">
            <span class="logo-red">DIH</span>
            <span class="logo-white">GYM</span>
        </div>
    </header>

    <main class="page-container">
        
        <h1 class="page-title">Coach Listing</h1>

        <div class="table-container">
            <table class="coach-table">
                <thead>
                    <tr>
                        <th>Type of Trainer</th>
                        <th>Name</th>
                        <th>Rates</th>
                        <th>Open Hours</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>[Type of Trainer]</td>
                        <td class="coach-name">[Coach Name]</td>
                        <td class="rate-amount">[Rate Amount]</td>
                        <td>[Open Hours]</td>
                    </tr>
                    </tbody>
            </table>
        </div>

    </main>

</body>
</html>

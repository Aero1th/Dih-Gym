<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIH GYM - Available Coaches</title>
    <!-- Linked to your custom local directory path with matching filename -->
    <link rel="stylesheet" href="../static/css/member_coachlist.css">
</head>
<body>

    <!-- Header Branding Bar -->
    <header class="brand-header">
        <div class="brand-logo">
            <span class="logo-red">DIH</span>
            <span class="logo-white">GYM</span>
        </div>
    </header>

    <main class="page-container">
        
        <h1 class="page-title">Hire a Coach</h1>

        <!-- Coaches Data Table Container -->
        <div class="table-container">
            <table class="coach-table">
                <thead>
                    <tr>
                        <th>Type of Trainer</th>
                        <th>Name</th>
                        <th>Rates</th>
                        <th>Open Hours</th>
                        <th class="center-col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for coach in coaches %}
                    <tr>
                        <td>{{ coach.specialization or 'General Trainer' }}</td>
                        <td class="coach-name">{{ coach.first_name }} {{ coach.last_name }}</td>
                        <td class="rate-amount">{{ coach.hourly_rate }}</td>
                        <td>By appointment</td>
                        <td class="center-col">
                            <form action="/book-session" method="POST">
                                <input type="hidden" name="coach_id" value="{{ coach.coach_id }}">
                                <input type="date" name="session_date" required>
                                <input type="time" name="session_time" required>
                                <button type="submit" class="btn-hire">HIRE COACH</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5">No coaches available.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>

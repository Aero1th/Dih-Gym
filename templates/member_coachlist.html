<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIH GYM - Available Coaches</title>
    <!-- Linked to your custom local directory path with matching filename -->
    <link rel="stylesheet" href="../static/css/member_coachlist.css">
</head>
<body>

    <!-- Header Branding Bar -->
    <header class="brand-header">
        <div class="brand-logo">
            <span class="logo-red">DIH</span>
            <span class="logo-white">GYM</span>
        </div>
    </header>

    <!-- Main Content Frame -->
    <main class="page-container">
        
        <h1 class="page-title">Hire a Coach</h1>

        <!-- Coaches Data Table Container -->
        <div class="table-container">
            <table class="coach-table">
                <thead>
                    <tr>
                        <th>Type of Trainer</th>
                        <th>Name</th>
                        <th>Rates</th>
                        <th>Open Hours</th>
                        <th class="center-col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- BACK-END ENGINE INSERTION POINT -->
                    <!-- Loop your database items here to generate rows dynamically -->
                    <!-- Example structure for your backend loop:
                    <tr>
                        <td>[Type of Trainer]</td>
                        <td class="coach-name">[Coach Name]</td>
                        <td class="rate-amount">[Rate Amount]</td>
                        <td>[Open Hours]</td>
                        <td class="center-col">
                            <button class="btn-hire" onclick="hireCoach('[Coach_ID]')">HIRE COACH</button>
                        </td>
                    </tr>
                    -->
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
